<dialog class="mobile-menu" id="mobile-menu" aria-label="Navigation menu">
  <div class="menu-panel">
    <button
      class="menu-close"
      type="button"
      aria-label="Close navigation menu"
      autofocus
    >
      <picture>
        <source
          media="(min-width: 768px)"
          srcset="./img/menu/close-tablet.svg"
        />
        <img src="./img/menu/close-mobile.svg" alt="" width="32" height="32" />
      </picture>
    </button>
    <nav class="mobile-navigation" aria-label="Mobile navigation">
      <ul class="mobile-navigation-list">
        <li><a class="navigation-link" href="#about-us">About us</a></li>
        <li><a class="navigation-link" href="#courses">Our courses</a></li>
        <li><a class="navigation-link" href="#mentors">Our mentors</a></li>
        <li><a class="navigation-link" href="#reviews">Reviews</a></li>
        <li><a class="navigation-link" href="#contacts">Contacts</a></li>
      </ul>
    </nav>
    <picture class="menu-picture">
      <source
        media="(min-width: 768px)"
        srcset="
          ./img/menu/camera-tablet.png    1x,
          ./img/menu/camera-tablet@2x.png 2x
        "
        width="480"
        height="476"
      />
      <img
        src="./img/menu/camera-mobile.png"
        srcset="
          ./img/menu/camera-mobile.png    1x,
          ./img/menu/camera-mobile@2x.png 2x
        "
        alt=""
        width="218"
        height="329"
      />
    </picture>
  </div>
</dialog>
